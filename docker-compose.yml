services:
  mysql:
    image: mysql:8.0.40
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8081
      AUDIT_PLATFORM_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
      AUDIT_PLATFORM_DATASOURCE_USERNAME: ${MYSQL_USER}
      AUDIT_PLATFORM_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      AUDIT_PLATFORM_CORS_ORIGINS: ${AUDIT_PLATFORM_CORS_ORIGINS}
      AUDIT_PLATFORM_API_DOCS_ENABLED: ${AUDIT_PLATFORM_API_DOCS_ENABLED:-true}
      AUDIT_PLATFORM_RATE_LIMIT_ENABLED: ${AUDIT_PLATFORM_RATE_LIMIT_ENABLED:-false}
      AUDIT_PLATFORM_RATE_LIMIT_REQUESTS_PER_MINUTE: ${AUDIT_PLATFORM_RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: ["mailhog"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
